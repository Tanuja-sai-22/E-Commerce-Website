<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ShopEase</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Cart</a>
    </nav>
  </header>

  <section class="products">
    <div class="product">
      <img src="images/product1.jpg.jpg" alt="Product 1">
      <h3>Product 1</h3>
      <p>₹499</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/product2.jpg.jpg" alt="Product 2">
      <h3>Product 2</h3>
      <p>₹699</p>
      <button>Add to Cart</button>
    </div>
     <div class="product">
      <img src="images/product3.jpg" alt="Product 3">
      <h3>Product 3</h3>
      <p>₹999</p>
      <button>Add to Cart</button>
    </div>
     <div class="product">
      <img src="images/product4.jpg" alt="Product 4">
      <h3>Product 4</h3>
      <p>₹299</p>
      <button>Add to Cart</button>
    </div>
     <div class="product">
      <img src="images/product5.jpg" alt="Product 5">
      <h3>Product 5</h3>
      <p>₹799</p>
      <button>Add to Cart</button>
    </div>
  </section>

  <footer>
    <p>© 2025 ShopEase | All rights reserved.</p>
  </footer>

  
<!-- Mini Cart -->
<div id="cart" class="cart">
  <h3>Shopping Cart</h3>
  <ul id="cart-items"></ul>
  <p id="cart-total">Total: ₹0</p>
  <button id="close-cart">Close Cart</button>
</div>

<!-- Cart Toggle Button -->
<button id="show-cart" class="show-cart-btn">Show Cart</button>
<script src="script.js"></script>
</body>
</html>
